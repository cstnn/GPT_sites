<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Development Dashboard</title>
<style>
:root{--bg:#0d1016;--panel:#151922;--card:#1d2330;--line:#30394a;--text:#f4f6fa;--muted:#9ba7b9;--accent:#8fb3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(13,16,22,.96);border-bottom:1px solid var(--line);padding:14px 18px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.title{font-size:20px;font-weight:800;margin-right:auto}.sub{color:var(--muted);font-size:12px}
input,select,button{background:#1a202b;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit}
button{cursor:pointer}.stats{display:flex;gap:8px;margin-top:10px;overflow:auto}.stat{white-space:nowrap;background:#171c26;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(6,minmax(260px,1fr));gap:12px;padding:14px;align-items:start;overflow-x:auto}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px;min-height:170px}.col.dragover{outline:2px solid var(--accent)}
.head{display:flex;align-items:center;justify-content:space-between;padding:8px;font-weight:800;font-size:18px}.count{font-size:11px;background:#283040;border-radius:999px;padding:3px 7px}
.cards{min-height:80px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:9px;cursor:grab}
.hero{aspect-ratio:4/3;background:#10141b;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}.info{padding:10px}.name{font-weight:750;font-size:15px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}.badge{font-size:10px;text-transform:uppercase;border:1px solid #4a5870;border-radius:999px;padding:2px 6px}.review{color:#ffd17a}
.next,.loc{color:var(--muted);font-size:12px;margin-top:7px;line-height:1.35}.actions{display:flex;gap:6px;margin-top:9px}.actions button,.actions select{font-size:12px;padding:6px 7px;min-width:0}.open{color:var(--accent);text-decoration:none;font-size:12px}
.empty{color:var(--muted);padding:12px 8px}.note{padding:0 18px 12px;color:var(--muted);font-size:12px}
@media(max-width:900px){header{position:static}.board{display:block;padding:10px}.col{margin-bottom:10px;min-height:0}.head{font-size:18px}.cards:empty{display:none}.card{cursor:default}.hero{aspect-ratio:16/9}.title{width:100%}#search{flex:1;min-width:140px}}
</style></head>
<body><header><div class="top"><div><div class="title">Product Development Dashboard</div><div class="sub" id="stamp">Loading portfolio…</div></div>
<input id="search" placeholder="Search products"><select id="filter"><option value="all">All products</option><option value="attention">Needs attention</option><option value="active">Active only</option></select>
<button id="reset" title="Remove manual browser overrides">Reset local changes</button></div><div class="stats" id="stats"></div></header>
<main class="board" id="board"></main><div class="note">Desktop: drag cards between stages. Mobile: use the stage selector on each card. Manual changes are stored in this browser for this first implementation and are shown as manual overrides.</div>
<script>
const stages=[
 {id:'idea',label:'Ideas'},{id:'specs',label:'Specs'},{id:'3mf',label:'3MF'},
 {id:'to_print',label:'To Print'},{id:'printed',label:'Printed'},{id:'published',label:'Published'}
];
let data={products:[]};const key='product-dashboard-overrides-v1';
const API_BASE=(localStorage.getItem('product-dashboard-api')||'').replace(/\/$/,'');
const overrides=()=>JSON.parse(localStorage.getItem(key)||'{}');
function effective(p){const o=overrides()[p.product_id];return o?{...p,...o,manual_override:true}:p}
async function setStage(id,stage){
 if(API_BASE){
   try{
     const r=await fetch(API_BASE+'/api/products/'+encodeURIComponent(id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({stage})});
     if(!r.ok) throw new Error('API '+r.status);
     const j=await r.json(); const i=data.products.findIndex(p=>p.product_id===id); if(i>=0)data.products[i]={...data.products[i],...j.product};
     const o=overrides();delete o[id];localStorage.setItem(key,JSON.stringify(o));render();return;
   }catch(e){alert('Shared update failed. The change was not saved centrally.');console.error(e);return}
 }
 const o=overrides();o[id]={...(o[id]||{}),stage,updated_at:new Date().toISOString(),update_source:'dashboard'};localStorage.setItem(key,JSON.stringify(o));render()
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(p){return `<article class="card" draggable="true" data-id="${esc(p.product_id)}">
<div class="hero">${p.hero_asset_url?'<img loading="lazy" src="'+esc(p.hero_asset_url)+'" alt="">':''}</div>
<div class="info"><div class="name">${esc(p.product_name)}</div><div class="row"><span class="badge">${esc(p.stage.replace('_',' '))}</span>${p.manual_override?'<span class="badge">manual</span>':''}${p.needs_review?'<span class="review">Needs review</span>':''}</div>
<div class="next"><b>Next:</b> ${esc(p.next_action||'—')}</div><div class="loc">${esc(p.location||'')}</div>
<div class="actions"><select aria-label="Move stage" onchange="setStage('${esc(p.product_id)}',this.value)">${stages.map(s=>'<option value="'+s.id+'" '+(s.id===p.stage?'selected':'')+'>'+s.label+'</option>').join('')}</select>
<a class="open" href="${esc(p.folder_url||'#')}" target="_blank" rel="noopener">Open folder ↗</a></div></div></article>`}
function render(){
 const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;
 let ps=data.products.map(effective).filter(p=>(p.product_name||'').toLowerCase().includes(q));
 if(f==='attention')ps=ps.filter(p=>p.needs_review||p.blocked);
 if(f==='active')ps=ps.filter(p=>p.stage!=='published');
 document.getElementById('board').innerHTML=stages.map(s=>{const items=ps.filter(p=>p.stage===s.id);return `<section class="col" data-stage="${s.id}"><div class="head"><span>${s.label}</span><span class="count">${items.length}</span></div><div class="cards">${items.map(card).join('')||'<div class="empty">No products</div>'}</div></section>`}).join('');
 const all=data.products.map(effective);document.getElementById('stats').innerHTML=`<span class="stat">${all.length} products</span><span class="stat">${all.filter(p=>p.stage!=='published').length} active</span><span class="stat">${all.filter(p=>p.needs_review).length} need attention</span><span class="stat">${all.filter(p=>p.manual_override).length} manual overrides</span>`;
 bindDnD();
}
function bindDnD(){
 document.querySelectorAll('.card').forEach(c=>c.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',c.dataset.id)));
 document.querySelectorAll('.col').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('dragover')});col.addEventListener('dragleave',()=>col.classList.remove('dragover'));col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('dragover');setStage(e.dataTransfer.getData('text/plain'),col.dataset.stage)})})
}
document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);
document.getElementById('reset').onclick=()=>{if(confirm('Remove manual stage changes stored in this browser?')){localStorage.removeItem(key);render()}};
(API_BASE?fetch(API_BASE+'/api/products',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('API '+r.status);return r.json()}).then(j=>({schema_version:3,generated_at:new Date().toISOString(),products:j.products})):fetch('./portfolio.json',{cache:'no-store'}).then(r=>r.json())).then(j=>{data=j;document.getElementById('stamp').textContent='Synced dataset: '+new Date(j.generated_at).toLocaleString();render()}).catch(e=>{document.getElementById('stamp').textContent='Could not load portfolio.json';console.error(e)});
</script></body></html>
